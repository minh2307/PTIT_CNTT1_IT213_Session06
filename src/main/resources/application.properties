spring.application.name=ss06

spring.datasource.url=jdbc:mysql://localhost:3306/bookings?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenRouter is compatible with OpenAI's Chat Completions API.
# Export OPENROUTER_API_KEY before starting the application; do not commit the key here.
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
spring.ai.openai.chat.temperature=0.2

server.port=8080
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
